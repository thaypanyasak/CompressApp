name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Prepare Flutter iOS tooling without overwriting app code
        run: |
          mkdir -p ios/Flutter
          flutter pub get
          flutter precache --ios
          ls -la ios/Flutter

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CompressApp.ipa Payload/
          echo "✅ IPA created: CompressApp.ipa"
          ls -lh CompressApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompressApp-IPA
          path: CompressApp.ipa
          retention-days: 14
